function designWarnings(){const t=E.totals(state.design),o=D.orbits.find(o=>o.id===state.design.orbit),plan=state.design.plan.imaging,draw=t.basePower+(plan==='eclipse'||plan==='all'?t.radarPower:0),need=draw*(o.eclipse[1]-o.eclipse[0])/60;if(t.capacity-need<D.scenario.reserve)return `<div class="notice warning">${icon('warn')}<span>Eclipse energy shortfall. Imaging may be shed at the 20 Wh reserve. Add battery capacity or schedule sunlit imaging.</span></div>`;return `<div class="notice">${icon('check')}<span>Predicted eclipse exit: <b>${fmt(t.capacity-need)} Wh</b>. Energy margin above the protected reserve.</span></div>`;}

'NOT INSTALLED'}</div><div class="view-caption">DRAG TO ROTATE · BOX ASSET PREVIEW</div><div class="view-controls"><button data-action="view-explode" title="Explode assembly" aria-label="Explode assembly">${icon('expand')}</button><button data-action="view-wire" title="Toggle wireframe" aria-label="Toggle wireframe">${icon('grid')}</button><button data-action="view-zoom" title="Change zoom" aria-label="Change zoom">${icon('zoom')}</button><button data-action="view-reset" title="Reset view" aria-label="Reset view">${icon('reset')}</button></div></div><div class="telemetry"><div class="metric"><label>LAUNCH MASS</label><strong>${fmt(t.mass)} <small>kg</small></strong></div><div class="metric"><label>SOLAR OUTPUT</label><strong class="cyan">${t.solar} <small>W</small></strong></div><div class="metric"><label>BATTERY CAPACITY</label><strong>${t.capacity} <small>Wh</small></strong></div></div></div><div class="panel pad"><div class="spread"><h3>Operating orbit</h3><span class="eyebrow tiny muted">GAME PROFILES</span></div><div class="orbit-options">${D.orbits.map(o=>`<button data-action="orbit-${o.id}" class="orbit-option ${state.design.orbit===o.id?'active':''}"><strong>${o.name}</strong><span>${o.period} min period · ${o.eclipse[1]-o.eclipse[0]} min eclipse</span></button>`).join('')}</div><p class="small muted" style="line-height:1.6;margin-top:12px">${D.orbits.find(o=>o.id===state.design.orbit).description}</p></div><div class="panel pad"><h3>Planned operations</h3>${planEditor(state.design.plan)}</div></section><aside class="stack"><div class="panel pad"><div class="spread"><span class="eyebrow tiny">${p.category==='required'?'REQUIRED SUBSYSTEM':'OPTIONAL ATTACHMENT'}</span>${icon(p.icon)}</div><h2 class="detail-title">${p.name}</h2><p class="description">${p.function}${p.benefit?' '+p.benefit:''}</p><div class="tier-grid">${D.tiers.map((name,i)=>`<button data-action="tier-${i}" class="${installed&&tier===i?'active':''}">${name}</button>`).join('')}</div><div class="spec-grid"><div><label>MASS</label><span>${fmt(p.mass*(1+tier*.24))} kg</span></div><div><label>HARDWARE COST</label><span>${fmt(p.cost*(1+tier*.4))} cr</span></div><div><label>${p.id==='power'||p.id==='battery'?'CAPACITY':p.id==='radar'?'RESOLUTION':p.id==='computer'?'STORAGE':p.downlink?'LINK RATE':'POWER DRAW'}</label><span>${p.capacity?p.capacity[tier]+' Wh':p.id==='radar'?p.resolution[tier]+' m':p.storage?p.storage[tier]+' GB':p.downlink?p.downlink[tier]+' GB/min':(p.baseDraw?p.baseDraw[tier]:p.watts)+' W'}</span></div><div><label>PARENT MOUNT</label><span>${p.parent||'Primary structure'}</span></div></div>${state.advanced?`<div class="notice"><span>Envelope: ${p.dimensions.map(x=>fmt(x*(1+tier*.12),2)).join(' × ')} m<br>Lead time: ${p.lead+tier*3} days<br>Higher tiers add mass, size and cost.${p.id==='radar'?'<br>Sensor: '+p.draw[tier]+' W · '+p.dataPerTile[tier]+' GB per tile':''}</span></div>`:''}<div class="spread" style="margin-top:14px"><button class="small cyan" data-action="advanced">${state.advanced?'− Less detail':'+ Engineering values'}</button>${btn(installed?'Remove':'Install','toggle-part','compact ghost')}</div></div><div class="panel pad"><h3>Design limits</h3>${resource('TOTAL SPENDING',t.totalCost,currentBudget(),'cr')}${resource('LAUNCH MASS',t.mass,v.capacity,'kg')}<p class="tiny muted" style="line-height:1.7;margin:8px 0 14px">Includes ${v.price} cr launch service and ${t.fuel} kg spacecraft propellant.</p>${designWarnings()}</div>${btn('Review preflight '+icon('arrow'),'nav-launch','primary full')}</aside></div>`;}
function rocketSVG(v){const side=v.id!=='falcon';return `<svg class="rocket-svg" viewBox="0 0 300 520" aria-label="${v.name} stylized launch vehicle"><defs><linearGradient id="metal"><stop stop-color="#70869b"/><stop offset=".35" stop-color="#eff5fc"/><stop offset=".65" stop-color="#bbcbd8"/><stop offset="1" stop-color="#566d85"/></linearGradient><linearGradient id="rocketBlack"><stop stop-color="#142233"/><stop offset=".5" stop-color="#3a4d5e"/><stop offset="1" stop-color="#08101c"/></linearGradient></defs><ellipse cx="150" cy="487" rx="103" ry="15" fill="#071b2a" stroke="#3387ad"/><ellipse cx="150" cy="487" rx="88" ry="9" fill="none" stroke="#61d9ff" stroke-width="2"/>${side?'<path d="M108 435V246q-2-25-10-39-8 14-10 39v189Z" fill="url(#metal)"/><path d="M192 435V246q2-25 10-39 8 14 10 39v189Z" fill="url(#metal)"/><path d="m90 435-7 20h30l-7-20M194 435l-7 20h30l-7-20" fill="url(#rocketBlack)"/>':''}<path d="M128 118V85Q130 40 150 16q20 24 22 69v33Z" fill="url(#metal)"/><path d="M132 118h36v302h-36Z" fill="url(#metal)"/><path d="M132 118h36v12h-36ZM132 212h36v35h-36ZM132 410h36v15h-36Z" fill="url(#rocketBlack)"/><path d="m135 420-7 35h44l-7-35Z" fill="url(#rocketBlack)"/><path d="m132 368-12 65h10l10-65M168 368l12 65h-10l-10-65" fill="#243c51"/><path d="M130 119h40M132 181h36M132 300h36M132 351h36" stroke="#6a879d" stroke-width="1"/><text x="150" y="175" text-anchor="middle" fill="#253f55" font-size="8" font-family="monospace" transform="rotate(90 150 175)">ORBITAL / EO-774</text><path d="M136 455v12M145 455v13M155 455v13M164 455v12" stroke="#8ba2b5" stroke-width="5"/><path d="M212 90v330M208 90h8M208 420h8" stroke="#3e7da3" stroke-width="1" stroke-dasharray="2 3"/><text x="222" y="263" fill="#5f8cae" font-size="8" font-family="monospace" transform="rotate(90 222 263)">SCHEMATIC · NOT TO SCALE</text></svg>`;}
function launch(){const v=D.rockets.find(v=>v.id===state.design.rocket),check=E.preflight(state.design,state.career);return `${pageTitle('Rocket selection & preflight','Verify the spacecraft, injection service, weather window and team approvals before committing.')}<div class="workspace launch-layout"><aside class="stack"><div class="panel pad"><div class="spread" style="margin-bottom:16px"><h3>Launch vehicles</h3>${icon('rocket')}</div><div class="stack">${D.rockets.map(v=>`<button class="rocket-card ${state.design.rocket===v.id?'active':''}" data-action="rocket-${v.id}">${icon('rocket')}<span><strong>${v.name}</strong><small>${v.operator}</small></span><span class="cost">${v.price} cr</span></button>`).join('')}</div><p class="tiny muted" style="line-height:1.8;margin-top:16px">Illustrative rideshare configurations. Capacity, dimensions and prices are game settings, not operator specifications.</p></div><div class="panel pad"><h3>Flight mode</h3><div class="tabs" style="margin-top:12px"><button data-action="mode-practice" class="${state.mode==='practice'?'active':''}">Practice</button><button data-action="mode-career" class="${state.mode==='career'?'active':''}">Career</button></div><p class="tiny muted" style="line-height:1.7;margin-top:10px">${state.mode==='practice'?'Practice uses the full simulator without changing career totals.':'A launch counts as a career attempt. Only improvement over your previous best earns points.'}</p></div></aside><section class="panel"><div class="viewport rocket-view"><div class="rocket-grid"></div>${rocketSVG(v)}<div class="view-head"><div><span class="eyebrow">${v.name.toUpperCase()}</span><p>${v.configuration.toUpperCase()}</p></div><span class="tag">LEO</span></div><div class="view-caption">INJECTION SERVICE / ${v.capacity} KG ALLOCATION</div></div><div class="telemetry"><div class="metric"><label>PAYLOAD MARGIN</label><strong class="cyan">${fmt(v.capacity-check.totals.mass)} <small>kg</small></strong></div><div class="metric"><label>LAUNCH COST</label><strong>${v.price} <small>cr</small></strong></div><div class="metric"><label>WIND</label><strong class="${check.weather.wind>18?'amber':'green'}">${check.weather.wind} <small>m/s</small></strong></div></div></section><aside class="stack"><div class="panel pad"><div class="spread"><h3>Preflight checklist</h3><span class="tag ${check.ok?'green':'amber'}">${check.ok?'GO FOR LAUNCH':'ACTION REQUIRED'}</span></div>${check.checks.map(c=>`<div class="check">${c.ok?'<span class="green">'+icon('check')+'</span>':'<span class="amber">'+icon('warn')+'</span>'}<div><strong>${c.name}</strong><p>${esc(c.detail)}</p></div></div>`).join('')}${!check.checks[7].ok?`<div style="margin-top:14px">${btn(icon('clock')+' Next window · +6 h','next-window','full')}</div>`:''}${state.design.crew.length?`<div style="margin-top:14px">${btn('Review crew approvals','approvals','full ghost')}</div>`:''}</div>${btn(icon('rocket')+' Launch mission','launch-now','primary full',check.ok?'':'disabled')}<p class="tiny muted" style="line-height:1.7">The 72-hour objective clock begins after deployment. Weather holds and blocked checks never count as attempts.</p>${btn(icon('back')+' Back to assembly','nav-build','ghost full')}</aside></div>`;}
function chart(run,scope='full'){let data=scope==='first'?run.trace.filter(x=>x.t<=D.orbits.find(o=>o.id===run.design.orbit).period):run.trace;if(!data.length)return '';let maxT=Math.max(90,data.at(-1).t),w=600,h=145,pad=28;const path=k=>data.filter((_,i)=>i===0||i===data.length-1||i%Math.max(1,Math.floor(data.length/350))===0).map((x,i)=>`${i?'L':'M'}${pad+x.t/maxT*(w-2*pad)},${h-pad-(x[k]/(k==='energy'?run.stats.capacity:run.stats.storage))*(h-2*pad)}`).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Battery energy in blue and stored data in green, each scaled to its capacity"><g class="chart-grid">${[0,.5,1].map(x=>`<path d="M${pad} ${h-pad-x*(h-2*pad)}H${w-pad}"/>`).join('')}</g><text x="3" y="24" class="chart-text">100%</text><text x="10" y="${h-pad+3}" class="chart-text">0</text><path d="M${pad} ${h-pad-20/run.stats.capacity*(h-2*pad)}H${w-pad}" stroke="#ffc46777" stroke-dasharray="4 4"/><path d="${path('energy')}" fill="none" stroke="#38bdf8" stroke-width="2"/><path d="${path('storage')}" fill="none" stroke="#62deb2" stroke-width="1.5"/><text x="${pad}" y="${h-6}" class="chart-text">T+00:00</text><text x="${w-pad}" y="${h-6}" text-anchor="end" class="chart-text">T+${time(maxT)}</text></svg>`;}
function eventList(run,onlyWarn=false){const events=onlyWarn?run.events.filter(e=>e.type==='warn'):run.events;return `<div class="event-list">${events.slice(-24).reverse().map(e=>`<div class="event"><time>${time(e.t)}</time><span class="${e.type==='warn'?'amber':e.type==='pass'?'green':''}">${esc(e.message)}</span></div>`).join('')||'<p class="small muted" style="padding:16px 0">No resource warnings recorded.</p>'}</div>`;}
function planEditor(plan){return `<div class="plan-field"><label for="imaging-plan">IMAGING SCHEDULE</label><select id="imaging-plan"><option value="eclipse" ${plan.imaging==='eclipse'?'selected':''}>Eclipse scan</option><option value="sunlit" ${plan.imaging==='sunlit'?'selected':''}>Sunlit target passes</option><option value="all" ${plan.imaging==='all'?'selected':''}>All target passes</option><option value="off" ${plan.imaging==='off'?'selected':''}>Standby · no imaging</option></select></div><label class="toggle-label"><input id="downlink-plan" type="checkbox" ${plan.downlink?'checked':''}> Transmit during ground contacts</label><p class="tiny muted" style="line-height:1.8;margin-top:12px">Eclipse scan keeps the radar powered throughout darkness. Sunlit mode only powers it during target passes. Day and night passes cover the same strip; repeat imagery earns no extra coverage.</p>`;}
function operations(){const r=state.run;if(!r)return '<div class="empty">No active mission.</div>';if(r.finished)return report();const f=E.flags(r),cov=E.coverage(r),a=f.phase/f.o.period*Math.PI*2-.5,x=50+39*Math.cos(a),y=50+24*Math.sin(a);return `${pageTitle('Mission operations','Objective: return ≥80% unique usable flood-zone coverage by T+72:00.')}<div class="ops-grid"><section class="stack"><div class="panel"><div class="orbit-view">${globe()}<div class="orbit-ellipse"></div><div class="orbiter" style="left:calc(${x}% - 12px);top:calc(${y}% - 12px)">${icon('box')}</div><div class="orbit-overlay spread"><div><div class="eyebrow tiny muted">MISSION ELAPSED</div><strong>T+${time(r.t)}</strong></div><div class="stack" style="gap:7px;align-items:end"><span class="tag ${f.eclipse?'amber':'green'}">${f.eclipse?'◐ ECLIPSE':'☼ SUNLIT'}</span><span class="tag">${f.contact?'GROUND CONTACT':'NO GROUND CONTACT'}</span></div></div><div class="orbit-label">${f.o.altitude} KM · ORBIT ${f.cycle+1} · SCHEMATIC TRACK</div></div><div class="metrics4"><div class="metric"><label>RETURNED COVERAGE</label><strong class="cyan">${fmt(cov)}<small>% / 80%</small></strong></div><div class="metric"><label>BATTERY ENERGY</label><strong class="${r.energy<=20?'amber':''}">${fmt(r.energy)} <small>Wh</small></strong></div><div class="metric"><label>STORED IMAGERY</label><strong>${fmt(r.storage)} <small>GB</small></strong></div><div class="metric"><label>SPACECRAFT FUEL</label><strong>${r.fuel} <small>kg</small></strong></div></div><div class="controls">${btn(icon(running?'pause':'play')+(running?'Pause':'Resume'),'play','primary compact',r.finished?'disabled':'')}<select id="speed" aria-label="Simulation speed">${[1,10,60].map(n=>`<option value="${n}" ${state.speed===n?'selected':''}>${n} min / sec</option>`).join('')}</select>${btn('+ 1 orbit','next-orbit','compact',r.finished?'disabled':'')}${btn('Complete mission '+icon('arrow'),'complete','compact ghost',r.finished?'disabled':'')}<span class="time-display">${fmt(r.t/4320*100,0)}% OF DEADLINE</span></div><div class="timeline"><div class="spread"><span class="eyebrow tiny muted">CURRENT ORBIT WINDOW</span><span class="tiny mono muted">${time(f.cycle*f.o.period)} → ${time((f.cycle+1)*f.o.period)}</span></div><div class="timeline-bar"><span class="eclipse" style="left:${f.o.eclipse[0]/f.o.period*100}%;width:${(f.o.eclipse[1]-f.o.eclipse[0])/f.o.period*100}%"></span>${f.o.contacts.map(c=>`<span class="contact" style="left:${c[0]/f.o.period*100}%;width:${(c[1]-c[0])/f.o.period*100}%"></span>`).join('')}${[f.o.sunPass,f.o.nightPass].map(p=>`<span class="pass" style="left:${p[0]/f.o.period*100}%;width:${(p[1]-p[0])/f.o.period*100}%"></span>`).join('')}<span class="cursor" style="left:${f.phase/f.o.period*100}%"></span></div><div class="spread tiny muted mono"><span>GREEN CONTACT · BLUE TARGET PASS · GREY ECLIPSE</span></div></div></div><div class="panel"><div class="panel-head"><h3>Power & data telemetry</h3><div class="trace-legend"><span><i></i>Battery</span><span><i style="background:var(--green)"></i>Storage</span></div></div>${chart(r)}<p class="tiny muted" style="padding:0 18px 14px">Percent of installed capacity · dashed line = 20 Wh protected reserve.</p></div></section><aside class="stack"><div class="panel pad"><div class="spread"><h3>Operations plan</h3>${icon('scan')}</div>${planEditor(r.design.plan)}${r.shed?`<div class="notice warning" style="margin-top:14px">${icon('warn')}<span>Imaging shed. Essential loads continue drawing battery energy until sunlight.</span></div>`:''}<hr class="divider-line"><div class="spread small"><span class="muted">Solar generation</span><span class="mono cyan">${f.eclipse?0:r.stats.solar} W</span></div><div class="spread small" style="margin-top:10px"><span class="muted">Active load</span><span class="mono">${r.safe?0:r.stats.basePower+(f.sensorOn?r.stats.radarPower:0)} W</span></div>${resource('ENERGY',r.energy,r.stats.capacity,'Wh',r.energy<=20)}${resource('STORAGE',r.storage,r.stats.storage,'GB')}</div><div class="panel pad"><div class="spread"><h3>Event log</h3><span class="tag">${running?'LIVE':'PAUSED'}</span></div>${eventList(r)}</div>${btn('End mission early','abort','ghost compact')}</aside></div>`;}
function report(){const r=state.run;if(!r)return '<div class="empty">Complete a mission to see a report.</div>';const q=E.complete(r,state.career),cov=q.coverage,warning=r.events.find(e=>e.type==='warn');const reasons=[];if(q.missedPower>0)reasons.push(`${fmt(q.missedPower/720*100)} percentage-points of target opportunities were lost after the battery reserve triggered load shedding.`);if(q.missedStorage>0)reasons.push(`${fmt(q.missedStorage/720*100)} percentage-points could not be captured because storage was full.`);if(q.undelivered>.01)reasons.push(`${fmt(q.undelivered)} GB remained onboard at the deadline. Only imagery delivered to Earth counts.`);if(r.aborted)reasons.push('The commander ended this mission before the deadline.');if(r.design.plan.imaging==='off')reasons.push('The instrument was in standby. Schedule imaging to collect science data.');if(!reasons.length)reasons.push('The spacecraft maintained energy and data margins throughout the scheduled passes.');return `${pageTitle('Mission report','Flight EO-774 · seed '+r.design.seed+' · '+r.mode+' · all readouts derived from the completed run.')}<div class="report-grid"><aside class="stack"><div class="panel pad"><div class="spread"><span class="eyebrow tiny muted">IMAGERY RETURNED</span>${icon('scan')}</div><div class="result-ring" style="background:conic-gradient(${q.ok?'#38bdf8':'#ffc467'} ${cov*3.6}deg,#172a41 0)"><div><strong class="${q.ok?'cyan':'amber'}">${fmt(cov)}<small style="font-size:18px">%</small></strong><span>80% REQUIRED</span></div></div><div class="spread small"><span class="muted">Mission score</span><strong class="mono">${q.score} / 100</strong></div><hr class="divider-line"><div class="spread small"><span class="muted">New career credit</span><strong class="mono cyan">+${q.earned.credit}</strong></div><div class="spread small" style="margin-top:13px"><span class="muted">Trust awarded</span><strong class="mono green">+${q.earned.trust}</strong></div><p class="tiny muted" style="line-height:1.8;margin-top:16px">${r.mode==='practice'?'Practice flight: career counters remain unchanged.':'Career credit is the improvement over the previous best for this scenario. Every launched retry counts as an attempt.'}</p></div><div class="panel pad"><h3>Delivered target map</h3><div class="swath-grid">${r.delivered.map(v=>`<i class="${v>.999?'done':v>0?'partial':''}"></i>`).join('')}</div><p class="tiny muted" style="margin-top:12px">720 unique area tiles · blue = delivered<br>Schematic coverage ledger, not a geographic map.</p></div></aside><section class="stack"><div class="report-banner ${q.ok?'':'warning'}"><div class="row">${icon(q.ok?'check':'warn')}<h2>${q.ok?'Primary objective achieved':'Primary objective missed'}</h2></div><p>${q.ok?'The flood-zone imagery reached Earth before the deadline. Your design and operations plan worked together.':'Launch and deployment succeeded, but the science objective was not met. Use the resource trace to improve the next flight.'}</p></div>${[['rocket','Launch & injection','Carrier delivered spacecraft to the selected LEO profile.','PASSED'],['box','Spacecraft deployment','Arrays deployed · 2 kg manoeuvring propellant consumed.','PASSED'],['scan','Science objective',fmt(cov)+'% returned / 80% required by 72 h',q.ok?'PASSED':'MISSED']].map((x,i)=>`<div class="panel checkpoint">${icon(x[0])}<div><strong>${x[1]}</strong><p>${x[2]}</p></div><span class="tag ${i===2&&!q.ok?'amber':'green'}">${x[3]}</span></div>`).join('')}<div class="panel"><div class="panel-head"><h3>First orbit · resource trace</h3><div class="trace-legend"><span><i></i>Battery</span><span><i style="background:var(--green)"></i>Storage</span></div></div>${chart(r,'first')}<p class="tiny muted" style="padding:0 18px 15px">Battery / ${r.stats.capacity} Wh · storage / ${r.stats.storage} GB · dashed reserve / 20 Wh</p></div><div class="action-bar">${btn(icon('layers')+' Revise design','revise','primary')}${btn(icon('reset')+' Replay same conditions','replay','ghost')}</div></section><aside class="stack"><div class="panel pad"><h3>What shaped the result</h3>${reasons.map(s=>`<p class="description" style="margin-top:13px;margin-bottom:0">${s}</p>`).join('')}<hr class="divider-line"><p class="small cyan" style="line-height:1.8">${q.missedPower>0?'Try a higher-capacity battery, or switch to sunlit target passes. Replay keeps the same seed and orbit conditions.':q.missedStorage>0||q.undelivered>20?'Try more storage, a faster downlink or onboard compression.':r.design.plan.imaging==='sunlit'?'Your sunlit schedule protects the eclipse battery reserve. Add a high-gain antenna to clear the remaining data sooner.':'Try the lean starter to achieve the objective with a smaller battery and a different schedule.'}</p>${warning?`<div class="notice warning" style="margin-top:15px"><span>FIRST RESOURCE EVENT<br><span class="mono">T+${time(warning.t)}</span><br>${esc(warning.message)}</span></div>`:''}</div><div class="report-numbers"><div class="metric"><label>ELAPSED</label><strong>${time(q.elapsed)}</strong></div><div class="metric"><label>MIN BATTERY</label><strong>${fmt(q.minEnergy)} <small>Wh</small></strong></div><div class="metric"><label>PEAK STORAGE</label><strong>${fmt(q.maxStorage)} <small>GB</small></strong></div><div class="metric"><label>UNSENT DATA</label><strong>${fmt(q.undelivered)} <small>GB</small></strong></div></div>${btn(icon('download')+' Export flight report','export-report','ghost full')}</aside></div>`;}
function render(){OrbitalView.detach();$('#root').innerHTML=header()+`<main class="app">${({mission:lobby,build:builder,launch,operations,report}[state.page]||lobby)()}${footer()}</main>`;if(state.page==='build')OrbitalView.attach($('#craft'),state.design.parts,state.selected);save();}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),4200);}
function modal(title,body){$('#modal').innerHTML=`<div class="dialog-head"><h2>${title}</h2><button data-action="close" aria-label="Close dialog">×</button></div><div class="dialog-body">${body}</div>`;if(!$('#modal').open)$('#modal').showModal();}
function pause(){running=false;if(timer)clearInterval(timer);timer=null;}
function goto(page){if(state.run&&!state.run.finished&&['mission','build','launch'].includes(page)){toast('Pause or finish the active mission before revising the design.');return;}if((page==='operations'||page==='report')&&!state.run)return;if(page==='report'&&!state.run.finished)return;pause();state.page=page==='operations'&&state.run?.finished?'report':page;render();window.scrollTo(0,0);}
function changed(){state.design.approvals=[];save();}
function exportFile(name,value,type='application/json'){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([typeof value==='string'?value:JSON.stringify(value,null,2)],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function guide(){modal('Flight manual',`<p>ORBITAL is an offline engineering game. The first playable mission is radar flood mapping over Ghana’s Volta Basin.</p>${[['Choose a design','Balanced has a larger battery. Lean uses a small battery and sunlit imaging. Eclipse lesson demonstrates a power shortfall.'],['Build and check','Select a component, inspect its tier and watch mass, cost, energy and storage change. Required parts and compatible mounts are checked before launch.'],['Clear the launch window','If wind exceeds 18 m/s, move to the next window. In co-op, every assigned role must approve. Blocked launches never change your career.'],['Operate the spacecraft','Time starts paused. Pick a schedule, enable downlink and advance one orbit or complete 72 hours. A 20 Wh reserve sheds imaging; essential loads still draw power.'],['Learn and replay','Only unique usable data returned to Earth counts. The report identifies power and storage losses. Revise the design or replay the same seed and command history.']].map((x,i)=>`<div class="help-grid"><span class="num">0${i+1}</span><div><h3>${x[0]}</h3><p>${x[1]}</p></div></div>`).join('')}<div class="notice"><span>Career: 20 launch + 20 deployment + up to 60 objective points. Only improvement over your previous best is credited. At 100 accumulated points, Trust increases by 10 + 5 × overflow, then Success resets to 0. Example: 80 + 25 = 35 Trust.</span></div><div class="dialog-actions">${btn('Ready for flight','close','primary')}</div>`);}
function profileDialog(){if(state.run&&!state.run.finished){toast('Finish this flight before changing profiles. Use Export save to back it up.');return;}modal('Local commander profile',`<p>Your progress stays in this browser. This name is local and creates no online account. Export a save before moving devices or clearing browser data.</p><label class="small" for="profile-name">Commander name</label><input id="profile-name" maxlength="50" placeholder="e.g. Senku" value="${esc(state.profile)}"><p>Current career: ${state.career.attempts} attempts · ${state.career.trust} Trust. Scenario funding: ${currentBudget()} credits. ${state.career.trust<360?'Next funding increase at '+[10,40,90,160,250,360].find(v=>v>state.career.trust)+' Trust.':'Maximum funding tier reached; Trust can keep growing.'} Renaming preserves this career. Export your save before starting a separate career.</p><div class="dialog-actions">${btn('Continue as guest','guest','ghost')}${btn('Save profile','save-profile','primary')}</div>`);}
function crewDialog(){if(state.run&&!state.run.finished){toast('Crew assignments are locked during flight.');return;}modal('Shared-screen crew',`<p>Up to four people share this screen, one design and one budget. Fill the roles you want to assign. Empty roles are covered by the commander.</p>${roles.map((role,i)=>`<div class="crew-role"><label for="crew-${i}">${role}<small>${['Route, budget and launch window','Hardware, mass and energy','Instrument and target coverage','Scheduling and data return'][i]}</small></label><input id="crew-${i}" maxlength="50" placeholder="Player name (optional)" value="${esc(state.design.crew.find(c=>c.role===role)?.name||'')}"></div>`).join('')}<div class="dialog-actions">${btn('Save crew','save-crew','primary')}</div>`);}
function approvalDialog(){modal('Crew launch review',`<p>Review the shared design, then each player approves their role. Changing the design, route or launch window clears all approvals.</p>${state.design.crew.map((c,i)=>`<label class="toggle-label" style="padding:13px 0;border-bottom:1px solid var(--line)"><input type="checkbox" data-approval="${i}" ${state.design.approvals.includes(i)?'checked':''}>${esc(c.name)} <span class="muted">· ${esc(c.role)}</span></label>`).join('')}<div class="dialog-actions">${btn('Save approvals','save-approvals','primary')}</div>`);}
function runStart(replaying=false){let r=replaying?E.replay(state.run,state.career):E.start(state.design,state.career,state.mode);if(r.error){toast('Launch blocked. Review the preflight checklist.');goto('launch');return;}state.run=r;state.design=E.clone(r.design);state.page='operations';running=false;render();toast('Deployment complete. Set your operations plan, then resume time.');}
function finish(){pause();E.complete(state.run,state.career);state.page='report';render();window.scrollTo(0,0);}
function goPlay(){if(!state.run||state.run.finished)return;if(running){pause();render();return;}running=true;timer=setInterval(()=>{E.step(state.run,state.run.t+state.speed/4);if(state.run.finished){finish();return;}if(!$('#modal').open&&document.activeElement?.tagName!=='SELECT')render();else save();},250);render();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='close'){$('#modal').close();return;}if(a.startsWith('view-')){const s=OrbitalView.action(a.slice(5));b.classList.toggle('active',a==='view-explode'?s.explode:a==='view-wire'?s.wire:false);return;}if(a.startsWith('nav-')){goto(a.slice(4));return;}if(a.startsWith('part-')){state.selected=a.slice(5);render();return;}if(a.startsWith('category-')){state.category=a.slice(9);state.selected=D.components.find(p=>p.category===state.category).id;render();return;}if(a.startsWith('tier-')){state.design.parts[state.selected]=Number(a.slice(5));changed();render();return;}if(a.startsWith('orbit-')){state.design.orbit=a.slice(6);changed();render();return;}if(a.startsWith('rocket-')){state.design.rocket=a.slice(7);changed();render();return;}if(a.startsWith('mode-')){const m=a.slice(5);if(m==='career'&&!state.profile){profileDialog();return;}state.mode=m;render();return;}
switch(a){case'choose':if(state.run&&!state.run.finished){goto('operations');break;}state.chosen=true;goto('build');break;case'advanced':state.advanced=!state.advanced;render();break;case'toggle-part':if(state.design.parts[state.selected]!==undefined)delete state.design.parts[state.selected];else state.design.parts[state.selected]=0;changed();render();break;case'next-window':state.design.window++;changed();render();toast('Moved to the next launch window. Deployment shifts by 6 hours.');break;case'crew':crewDialog();break;case'save-crew':state.design.crew=roles.map((role,i)=>({role,name:$('#crew-'+i).value.trim()})).filter(c=>c.name);changed();$('#modal').close();render();break;case'approvals':approvalDialog();break;case'save-approvals':state.design.approvals=[...document.querySelectorAll('[data-approval]:checked')].map(el=>+el.dataset.approval);$('#modal').close();render();break;case'profile':profileDialog();break;case'save-profile':{let name=$('#profile-name').value.trim();if(!name){toast('Enter a name or continue as guest.');break;}state.profile=name;state.mode='career';$('#modal').close();render();toast('Local profile saved. Career mode enabled.');break;}case'guest':state.profile='';state.mode='practice';$('#modal').close();render();break;case'launch-now':runStart();break;case'play':goPlay();break;case'next-orbit':pause();E.step(state.run,Math.min(4320,state.run.t+E.flags(state.run).o.period));if(state.run.finished)finish();else render();break;case'complete':finish();break;case'abort':pause();render();modal('End this mission?',`<p>This stops the flight at T+${time(state.run.t)}. A career flight counts as a failed attempt even if launch and deployment earned partial points. You can resume instead.</p><div class="dialog-actions">${btn('Keep flying','close','ghost')}${btn('End mission','confirm-abort','danger')}</div>`);break;case'confirm-abort':$('#modal').close();E.complete(state.run,state.career,true);state.page='report';render();break;case'revise':state.design=E.clone(state.run.design);state.run=null;state.design.approvals=[];goto('build');break;case'replay':runStart(true);break;case'guide':guide();break;case'provenance':modal('Data & assumptions',`<p>${esc(D.provenance)}</p><table class="data-table"><tr><th>MODEL</th><th>DEMO ASSUMPTION</th></tr><tr><td>Scenario</td><td>Floodwatch EO-774 · version 0.1.0</td></tr><tr><td>Geometry</td><td>720 equal area tiles; 15 per orbit</td></tr><tr><td>Radar image</td><td>1 GB per Basic-tier tile</td></tr><tr><td>Clouds</td><td>SAR observations usable day / night</td></tr><tr><td>Contact</td><td>Fixed windows; GB/min link rate</td></tr><tr><td>Power</td><td>Constant W between events; 20 Wh reserve</td></tr><tr><td>Bus</td><td>Essential loads continue after imaging shed</td></tr><tr><td>Carrier</td><td>Service allocation; no ascent / fuel model</td></tr><tr><td>Orbits</td><td>Illustrative schedules, not propagated ephemerides</td></tr><tr><td>Thermal / ADCS</td><td>Capability and power checks; no dynamics</td></tr></table><p>There are no live APIs or real emergency observations. NASA/JPL and launcher operator data are not bundled as validated specifications in this version. The other four mission types are planned.</p><div class="dialog-actions">${btn('Close','close','primary')}</div>`);break;case'export':exportFile('orbital-save.json',serializable());toast('Save exported. Keep it to resume on another device.');break;case'import':pause();$('#import-file').click();break;case'export-report':{const r=state.run,q=E.complete(r,state.career);exportFile('orbital-EO774-flight-report.json',{version:D.version,scenario:D.scenario,summary:q,design:r.initialDesign,commands:r.changes,resourceTrace:r.trace,events:r.events,provenance:D.provenance});break;}}
});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='preset'&&el.value){const crew=state.design.crew;state.design=E.starter(el.value);state.design.crew=crew;changed();render();toast('Starter design loaded. Review the operations schedule before launch.');}if(el.id==='speed'){state.speed=+el.value;save();}if(el.id==='imaging-plan'||el.id==='downlink-plan'){const plan={imaging:$('#imaging-plan').value,downlink:$('#downlink-plan').checked};if(state.run&&!state.run.finished){E.changePlan(state.run,plan);state.design.plan=E.clone(plan);render();}else{state.design.plan=plan;changed();render();}}});
$('#import-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5e6)throw Error('Save exceeds 5 MB');const incoming=restore(JSON.parse(await f.text()));modal('Restore this save?',`<p>This replaces the current local session with ${esc(incoming.profile||'a guest session')}. Export your current save first if you want to keep it.</p><div class="dialog-actions">${btn('Export current','export','ghost')}${btn('Cancel','close','ghost')}<button class="btn primary" id="confirm-import">Restore save</button></div>`);$('#confirm-import').onclick=()=>{pause();state=incoming;if(state.run&&!state.run.finished)state.page='operations';$('#modal').close();render();toast('Save restored. Simulation is paused.');};}catch(err){toast('Could not import save: '+err.message);}e.target.value='';});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&state.page==='operations'&&!$('#modal').open&&!['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement?.tagName)){e.preventDefault();goPlay();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){pause();render();}});
window.addEventListener('beforeunload',save);
render();
</script></body></html>
