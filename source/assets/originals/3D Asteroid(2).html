<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asteroid</title>
<style>
:root{color-scheme:dark;--bg:#04050a;--fg:#ece8e1;--mut:#9a9288;--ln:#38342e;--ac:#e0c9a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.5 Georgia,"Times New Roman",serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
header{position:fixed;left:20px;top:calc(env(safe-area-inset-top,0px) + 16px);pointer-events:none}
h1{margin:0;font-weight:400;font-size:30px}
header p{margin:2px 0 0;color:var(--mut);font-size:14px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:center;gap:4px;padding:6px;border:1px solid var(--ln);border-radius:999px;background:rgba(14,12,10,.78);backdrop-filter:blur(8px);max-width:calc(100% - 20px);overflow-x:auto}
button{font:inherit;font-size:14px;color:var(--fg);background:none;border:0;border-radius:999px;padding:7px 13px;cursor:pointer;white-space:nowrap}
button:hover{background:rgba(224,201,166,.12)}
button[aria-pressed=true]{background:var(--ac);color:#18130b}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input[type=range]{width:90px;accent-color:#e0c9a6}
</style></head><body>
<canvas id="c"></canvas>
<header><h1 id="nm">Asteroid</h1><p id="st"></p><p>Drag to rotate, scroll to zoom.</p></header>
<nav aria-label="Asteroid controls">
<button id="bs" aria-pressed="true">Spin</button>
<button id="bw" aria-pressed="false">Wireframe</button>
<button id="bn">New asteroid</button>
<input id="rg" type="range" min="0" max="360" value="50" aria-label="Sun angle">
<button id="bi" aria-label="Zoom in">+</button><button id="bo" aria-label="Zoom out">&minus;</button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const h3=(x,y,z)=>{const s=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return s-Math.floor(s)};
const v3=(x,y,z)=>{const i=Math.floor(x),j=Math.floor(y),k=Math.floor(z),fx=x-i,fy=y-j,fz=z-k,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),w=fz*fz*(3-2*fz),L=(a,b,t)=>a+(b-a)*t;
  return L(L(L(h3(i,j,k),h3(i+1,j,k),u),L(h3(i,j+1,k),h3(i+1,j+1,k),u),v),L(L(h3(i,j,k+1),h3(i+1,j,k+1),u),L(h3(i,j+1,k+1),h3(i+1,j+1,k+1),u),v),w)};
const fb=(x,y,z)=>v3(x,y,z)*.55+v3(x*2.1,y*2.1,z*2.1)*.3+v3(x*4.4,y*4.4,z*4.4)*.15;
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

function build(seed){
  const r=rng(seed),off=r()*100,ax=[1+r()*.35,.68+r()*.22,.58+r()*.2];
  const base=new THREE.IcosahedronGeometry(1,36),pa=base.attributes.position,map=new Map(),pos=[],idx=[];
  for(let i=0;i<pa.count;i++){const x=pa.getX(i),y=pa.getY(i),z=pa.getZ(i),k=x.toFixed(4)+','+y.toFixed(4)+','+z.toFixed(4);let j=map.get(k);
    if(j===undefined){j=pos.length/3;map.set(k,j);pos.push(x,y,z)}idx.push(j)}
  base.dispose();
  const C=[],nC=Math.round(60+r()*40);
  for(let i=0;i<nC;i++){const u=r()*2-1,a=r()*6.2832,s=Math.sqrt(1-u*u);C.push({d:[s*Math.cos(a),u,s*Math.sin(a)],R:.05+Math.pow(r(),2.6)*.42})}
  const col=[],out=[],n=pos.length/3;
  for(let i=0;i<n;i++){let x=pos[3*i],y=pos[3*i+1],z=pos[3*i+2],rad=1+.32*(fb(x*1.1+off,y*1.1+off,z*1.1+off)-.5)*2,cr=0;
    for(const c of C){const dt=x*c.d[0]+y*c.d[1]+z*c.d[2],a=Math.acos(Math.min(1,dt));if(a<c.R*1.35){const t=a/c.R;
      if(t<1){const dp=.09*c.R*6;rad-=Math.min(.12,dp)*(1-t*t);cr-=1-t*t}else{const q=(t-1)/.35;rad+=.02*c.R*6*Math.sin(Math.PI*(1-q))*.6;cr+=.4*(1-q)}}}
    const gr=fb(x*9+off,y*9+off,z*9+off);rad+=(gr-.5)*.022;
    out.push(x*rad*ax[0],y*rad*ax[1],z*rad*ax[2]);
    const sh=Math.max(.18,Math.min(.75,.36+(gr-.5)*.35+cr*.12));col.push(sh*1.04,sh*.97,sh*.9)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(out,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.setIndex(idx);g.computeVertexNormals();g.computeBoundingBox();
  const L=['A','B','C','D','E','F','G','H','J','K','L','M','N','P','Q','R','S','T','U','V','W','X','Y'],q=rng(seed+7);
  g.userData.name='2026 '+L[(q()*L.length)|0]+L[(q()*L.length)|0]+(1+((q()*88)|0));g.userData.n=nC;return g;
}
const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setClearColor(0x04050a);
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,200);cam.position.z=4.2;
const sun=new THREE.DirectionalLight(0xfff3e0,2.4);S.add(sun);S.add(new THREE.AmbientLight(0x303848,.14));
const pivot=new THREE.Group();S.add(pivot);
const mat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,metalness:0});
const rock=new THREE.Mesh(build(7),mat);pivot.add(rock);
const sp=[];for(let i=0;i<1800;i++){const u=Math.random()*2-1,a=Math.random()*6.283,r=Math.sqrt(1-u*u);sp.push(60*r*Math.cos(a),60*u,60*r*Math.sin(a))}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
S.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xd8dcec,size:.12})));
function info(){const g=rock.geometry,b=g.boundingBox,k=6,f=a=>(a*k).toFixed(1);
  document.getElementById('nm').textContent='Asteroid '+g.userData.name;
  document.getElementById('st').textContent='\u2248 '+f(b.max.x-b.min.x)+' \u00d7 '+f(b.max.y-b.min.y)+' \u00d7 '+f(b.max.z-b.min.z)+' km \u00b7 '+g.userData.n+' craters (1 unit = 6 km)'}
info();
function fit(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',fit);fit();
const rg=document.getElementById('rg');
const setSun=()=>{const a=rg.value*Math.PI/180;sun.position.set(5*Math.sin(a),1.5,5*Math.cos(a))};rg.oninput=setSun;setSun();
let spin=!matchMedia('(prefers-reduced-motion: reduce)').matches,drag=null,zoom=4.2,seed=7;pivot.rotation.x=.3;
const cv=R.domElement;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;pivot.rotation.y+=(e.clientX-drag.x)*.006;pivot.rotation.x=Math.max(-1.5,Math.min(1.5,pivot.rotation.x+(e.clientY-drag.y)*.006));drag={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointerup',()=>drag=null);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(1.8,Math.min(9,zoom*(1+e.deltaY*.001)))},{passive:false});
const bs=document.getElementById('bs'),bw=document.getElementById('bw');bs.setAttribute('aria-pressed',spin);
bs.onclick=()=>{spin=bs.getAttribute('aria-pressed')!=='true';bs.setAttribute('aria-pressed',spin)};
bw.onclick=()=>{const on=bw.getAttribute('aria-pressed')!=='true';bw.setAttribute('aria-pressed',on);mat.wireframe=on};
document.getElementById('bn').onclick=()=>{seed=(seed*7919+13)%100003;const o=rock.geometry;rock.geometry=build(seed);o.dispose();info()};
document.getElementById('bi').onclick=()=>zoom=Math.max(1.8,zoom*.8);
document.getElementById('bo').onclick=()=>zoom=Math.min(9,zoom*1.25);
(function loop(){requestAnimationFrame(loop);if(spin&&!drag){rock.rotation.y+=.004;rock.rotation.x+=.0012}
  cam.position.z+=(zoom-cam.position.z)*.12;R.render(S,cam)})();
</script></body></html>
