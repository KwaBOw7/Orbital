<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Lunar Lander</title>
<style>
  :root { box-sizing: border-box; color-scheme: dark; --bg:#05060a; --fg:#c9ccd4; --accent:#e8b84a; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #bar { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }
  button { pointer-events: auto; font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; color: #111; background: var(--accent);
    border: 0; border-radius: 999px; padding: 10px 20px; cursor: pointer; }
  button.on { background: #ff6a3d; color: #fff; }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); text-align: center;
    color: var(--fg); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; opacity: .7; pointer-events: none; }
</style>
</head>
<body>
<div id="bar"><button id="fire">Fire descent engine</button></div>
<div id="hint">Drag to rotate · scroll or pinch to zoom</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var BG = 0x05060a;
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(BG);
  scene.fog = new THREE.Fog(BG, 22, 48);
  var camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // seeded random
  var seed = 11;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }

  // ---------- ground ----------
  function sstep(a, b, x) { var t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
  var gg = new THREE.PlaneGeometry(90, 90, 200, 200);
  gg.rotateX(-Math.PI / 2);
  var gp = gg.attributes.position;
  for (var i = 0; i < gp.count; i++) {
    var x = gp.getX(i), z = gp.getZ(i), d = Math.sqrt(x * x + z * z);
    var h = Math.sin(x * 0.7) * Math.cos(z * 0.6) * 0.18 + Math.sin(x * 2.3 + z * 1.9) * 0.05 + Math.sin(x * 6.1 - z * 5.3) * 0.015;
    gp.setY(i, h * sstep(3.5, 9, d));
  }
  gg.computeVertexNormals();
  var ground = new THREE.Mesh(gg, new THREE.MeshStandardMaterial({ color: 0x737376, roughness: 1 }));
  ground.receiveShadow = true;
  scene.add(ground);

  // rocks
  var rockMat = new THREE.MeshStandardMaterial({ color: 0x5f5f63, roughness: 1, flatShading: true });
  for (var i = 0; i < 40; i++) {
    var ang = rnd() * Math.PI * 2, rr = 4.5 + rnd() * 16, s = 0.08 + rnd() * 0.3;
    var rock = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockMat);
    rock.position.set(Math.sin(ang) * rr, s * 0.3, Math.cos(ang) * rr);
    rock.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3);
    rock.scale.y = 0.6;
    rock.castShadow = rock.receiveShadow = true;
    scene.add(rock);
  }

  // ---------- lander ----------
  var lander = new THREE.Group();
  scene.add(lander);
  var gold = new THREE.MeshStandardMaterial({ color: 0xc8a02a, metalness: 0.75, roughness: 0.35 });
  var gold2 = new THREE.MeshStandardMaterial({ color: 0x9c7a1c, metalness: 0.7, roughness: 0.45 });
  var silver = new THREE.MeshStandardMaterial({ color: 0xb9bdc4, metalness: 0.6, roughness: 0.4 });
  var dark = new THREE.MeshStandardMaterial({ color: 0x2a2c31, metalness: 0.5, roughness: 0.5 });
  var glass = new THREE.MeshStandardMaterial({ color: 0x0b1118, metalness: 0.9, roughness: 0.15 });

  function add(mesh, parent) { mesh.castShadow = mesh.receiveShadow = true; (parent || lander).add(mesh); return mesh; }
  function strut(a, b, r, mat) {
    var d = new THREE.Vector3().subVectors(b, a), L = d.length();
    var m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, L, 8), mat);
    m.position.copy(a).add(b).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
    return add(m);
  }

  // descent stage (octagon prism, flat facing front)
  var ds = add(new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.9, 8), gold));
  ds.position.y = 1.6; ds.rotation.y = Math.PI / 8;
  for (var k = 0; k < 8; k++) {
    var phi = k * Math.PI / 4;
    var panel = add(new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.72, 0.04), k % 2 ? gold2 : gold));
    panel.position.set(Math.sin(phi) * 1.12, 1.6, Math.cos(phi) * 1.12);
    panel.rotation.y = phi;
  }
  // engine bell
  var bell = add(new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.55, 0.55, 20, 1, true), dark));
  bell.material = dark.clone(); bell.material.side = THREE.DoubleSide;
  bell.position.y = 0.88;

  // ascent stage
  var as = add(new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.9, 1.0, 8), silver));
  as.position.y = 2.55; as.rotation.y = Math.PI / 8;
  var top = add(new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.85, 0.35, 8), silver));
  top.position.y = 3.22; top.rotation.y = Math.PI / 8;
  var dock = add(new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16), dark));
  dock.position.y = 3.5;
  // windows + hatch
  [-0.35, 0.35].forEach(function (wx) {
    var w = add(new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.34, 0.05), glass));
    w.position.set(wx, 2.85, 0.8); w.rotation.x = -0.1;
  });
  var hatch = add(new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.55, 0.05), dark));
  hatch.position.set(0, 2.35, 0.8);
  var porch = add(new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.05, 0.45), silver));
  porch.position.set(0, 2.05, 1.05);

  // RCS thruster quads
  for (var k = 0; k < 4; k++) {
    var phi = Math.PI / 4 + k * Math.PI / 2;
    var q = new THREE.Group();
    add(new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22, 0.22), dark), q);
    [[0.14, 0], [-0.14, 0], [0, 0.14], [0, -0.14]].forEach(function (o) {
      var n = add(new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, 0.18, 8), dark), q);
      n.rotation.x = Math.PI / 2;
      n.position.set(o[0], o[1], 0.15);
    });
    q.position.set(Math.sin(phi) * 0.9, 2.6, Math.cos(phi) * 0.9);
    q.rotation.y = phi;
    lander.add(q);
  }

  // antenna dish
  var mast = strut(new THREE.Vector3(-0.35, 3.3, -0.35), new THREE.Vector3(-0.5, 3.95, -0.5), 0.03, dark);
  var dish = add(new THREE.Mesh(new THREE.SphereGeometry(0.4, 20, 8, 0, Math.PI * 2, 0, Math.PI / 2.4), silver));
  dish.material = silver.clone(); dish.material.side = THREE.DoubleSide;
  dish.position.set(-0.5, 4.0, -0.5); dish.rotation.set(-0.7, 0.6, 0);
  var rod = strut(new THREE.Vector3(0.45, 3.3, -0.3), new THREE.Vector3(0.45, 4.2, -0.3), 0.015, dark);

  // legs
  var footR = 3.0;
  for (var k = 0; k < 4; k++) {
    var phi = Math.PI / 4 + k * Math.PI / 2, sx = Math.sin(phi), cz = Math.cos(phi);
    var top = new THREE.Vector3(sx * 1.1, 1.95, cz * 1.1);
    var foot = new THREE.Vector3(sx * footR, 0.1, cz * footR);
    strut(top, foot, 0.07, silver);
    var low = new THREE.Vector3(sx * 1.12, 1.25, cz * 1.12);
    var mid = new THREE.Vector3().lerpVectors(top, foot, 0.6);
    strut(low, mid, 0.05, silver);
    var pad = add(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.42, 0.1, 20), gold2));
    pad.position.set(foot.x, 0.05, foot.z);
    var bolt = add(new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 8), dark));
    bolt.position.copy(foot);
    if (k !== 1) {
      var probe = strut(new THREE.Vector3(foot.x, 0.1, foot.z), new THREE.Vector3(foot.x * 1.15, -0.4 + 0.5, foot.z * 1.15), 0.012, dark);
    }
  }

  // exhaust flame
  var flame = new THREE.Group();
  var outer = new THREE.Mesh(new THREE.ConeGeometry(0.55, 2.2, 20, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xff7a2a, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false }));
  var inner = new THREE.Mesh(new THREE.ConeGeometry(0.28, 1.5, 20, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xfff1c9, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false }));
  outer.rotation.x = Math.PI; inner.rotation.x = Math.PI;
  outer.position.y = -1.1; inner.position.y = -0.75;
  flame.add(outer); flame.add(inner);
  flame.position.y = 0.62;
  flame.visible = false;
  lander.add(flame);
  var glow = new THREE.PointLight(0xff8a3c, 0, 14);
  glow.position.set(0, -0.3, 0);
  lander.add(glow);

  // ---------- lights ----------
  scene.add(new THREE.AmbientLight(0x2a2f3a, 0.7));
  var sun = new THREE.DirectionalLight(0xfff4e4, 2.6);
  sun.position.set(9, 6, 7);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  var sc = sun.shadow.camera; sc.left = -9; sc.right = 9; sc.top = 9; sc.bottom = -9; sc.near = 1; sc.far = 40;
  sun.shadow.bias = -0.0005;
  scene.add(sun);

  // stars
  var sp = [];
  for (var i = 0; i < 1000; i++) {
    var u = rnd() * 0.9 + 0.08, th = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u), R = 90;
    sp.push(R * s * Math.cos(th), R * u, R * s * Math.sin(th));
  }
  var sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 0.35, sizeAttenuation: true, fog: false })));

  // ---------- controls ----------
  var target = new THREE.Vector3(0, 1.8, 0);
  var rotY = 0.7, rotX = 0.28, dist = 11, dragging = false, lx = 0, ly = 0, pointers = {}, pinch = 0;
  var el = renderer.domElement;
  el.addEventListener('pointerdown', function (e) {
    pointers[e.pointerId] = e; dragging = true; lx = e.clientX; ly = e.clientY; el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', function (e) {
    if (!pointers[e.pointerId]) return;
    pointers[e.pointerId] = e;
    var ids = Object.keys(pointers);
    if (ids.length === 2) {
      var d = Math.hypot(pointers[ids[0]].clientX - pointers[ids[1]].clientX, pointers[ids[0]].clientY - pointers[ids[1]].clientY);
      if (pinch) dist = Math.min(26, Math.max(5, dist * pinch / d));
      pinch = d; return;
    }
    rotY -= (e.clientX - lx) * 0.006; rotX += (e.clientY - ly) * 0.006;
    rotX = Math.max(0.03, Math.min(1.45, rotX));
    lx = e.clientX; ly = e.clientY;
  });
  function release(e) { delete pointers[e.pointerId]; pinch = 0; dragging = Object.keys(pointers).length > 0; }
  el.addEventListener('pointerup', release); el.addEventListener('pointercancel', release);
  el.addEventListener('wheel', function (e) {
    e.preventDefault(); dist = Math.min(26, Math.max(5, dist * (1 + e.deltaY * 0.001)));
  }, { passive: false });
  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  });

  var firing = false, btn = document.getElementById('fire');
  btn.addEventListener('click', function () {
    firing = !firing;
    btn.textContent = firing ? 'Cut engine' : 'Fire descent engine';
    btn.className = firing ? 'on' : '';
  });

  var t = 0;
  (function loop() {
    requestAnimationFrame(loop);
    t += 0.05;
    if (!dragging) rotY += 0.0018;
    var goal = firing ? 3.2 : 0;
    lander.position.y += (goal - lander.position.y) * 0.025;
    flame.visible = firing || lander.position.y > 0.3 && false;
    if (flame.visible) {
      var f = 1 + Math.sin(t * 9) * 0.08 + Math.sin(t * 23) * 0.05;
      outer.scale.set(f, 1 + Math.sin(t * 13) * 0.1, f);
      inner.scale.set(1 / f, 1 + Math.sin(t * 17) * 0.1, 1 / f);
    }
    glow.intensity = firing ? 2.5 + Math.sin(t * 11) * 0.4 : 0;
    camera.position.set(
      target.x + dist * Math.sin(rotY) * Math.cos(rotX),
      target.y + dist * Math.sin(rotX),
      target.z + dist * Math.cos(rotY) * Math.cos(rotX));
    camera.lookAt(target.x, target.y + lander.position.y * 0.4, target.z);
    renderer.render(scene, camera);
  })();
})();
</script>
</body>
</html>
