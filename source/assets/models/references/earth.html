<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earth</title>
<style>
:root{color-scheme:dark;--bg:#04060d;--fg:#e8edf5;--mut:#8a97ab;--ln:#2a3a56;--ac:#7ab8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.5 Georgia,"Times New Roman",serif;overflow:hidden;background-color:var(--bg)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
header{position:fixed;left:20px;top:calc(env(safe-area-inset-top,0px) + 16px);pointer-events:none}
h1{margin:0;font-weight:400;font-size:34px;letter-spacing:.01em}
#ro{margin:2px 0 0;color:var(--mut);font-size:14px;min-height:21px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:6px;padding:6px;border:1px solid var(--ln);border-radius:999px;background:rgba(8,12,22,.75);backdrop-filter:blur(8px)}
button{font:inherit;font-size:14px;color:var(--fg);background:none;border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
button:hover{background:rgba(122,184,255,.12)}
button[aria-pressed=true]{background:var(--ac);color:#04101f}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body>
<canvas id="c"></canvas>
<header><h1>Earth</h1><p id="ro">Drag to rotate, scroll to zoom, click for coordinates.</p></header>
<nav aria-label="Globe controls">
<button id="bs" aria-pressed="true">Spin</button>
<button id="bc" aria-pressed="true">Clouds</button>
<button id="bn" aria-pressed="false">Light night side</button>
<button id="bi" aria-label="Zoom in">+</button><button id="bo" aria-label="Zoom out">&minus;</button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---- continent outlines (lon,lat), coarse ----
const LAND=[
"-168,66 -156,71 -125,70 -95,72 -80,63 -62,58 -56,50 -66,44 -76,36 -81,30 -80,25 -90,30 -97,26 -97,20 -88,21 -88,16 -83,10 -78,8 -80,8 -86,13 -95,16 -105,22 -112,30 -115,32 -120,34 -124,40 -124,48 -135,58 -150,60 -165,60",
"-55,60 -44,60 -20,70 -20,82 -60,82 -70,76 -55,68",
"-78,8 -62,11 -52,5 -35,-6 -40,-22 -48,-26 -58,-38 -65,-42 -68,-52 -74,-52 -73,-40 -71,-20 -76,-14 -81,-5 -78,2",
"-10,36 -9,43 -2,44 -5,48 2,51 8,54 10,58 5,62 15,69 30,71 40,67 30,60 28,55 38,47 28,41 23,37 18,40 12,44 8,44 3,43 -1,37",
"-17,21 -10,35 10,37 32,31 35,28 43,12 51,12 40,-3 40,-15 33,-26 20,-35 14,-22 12,-5 9,4 -8,4 -17,14",
"28,41 36,36 35,30 43,13 52,16 58,23 57,26 67,25 73,20 77,8 80,15 90,22 98,16 100,3 104,1 109,12 106,20 122,30 122,40 135,44 141,52 160,60 180,66 180,69 140,72 110,77 80,73 60,69 40,67 30,60 28,55 38,47",
"114,-22 130,-12 142,-11 146,-19 153,-27 150,-37 140,-38 130,-32 115,-34",
"-180,-90 180,-90 180,-72 90,-67 0,-70 -90,-73 -180,-72",
"-5,50 1,51 -2,58 -6,56","130,31 140,36 142,43 140,41 133,35","95,5 105,-6 120,-9 140,-8 130,-1 110,-3","44,-25 50,-15 47,-13","-9,52 -6,55 -6,52","172,-41 178,-38 174,-35 168,-46","105,-6 114,-8 106,-7"
];
const h=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)};
const vn=(x,y)=>{const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);return h(i,j)*(1-u)*(1-v)+h(i+1,j)*u*(1-v)+h(i,j+1)*(1-u)*v+h(i+1,j+1)*u*v};
const fbm=(x,y)=>vn(x,y)*.55+vn(x*2.1,y*2.1)*.3+vn(x*4.3,y*4.3)*.15;

function makeEarth(){
  const W=1536,H=768,mk=()=>{const k=document.createElement('canvas');k.width=W;k.height=H;return k};
  const m=mk(),mc=m.getContext('2d');mc.fillStyle='#000';mc.fillRect(0,0,W,H);mc.fillStyle='#fff';
  for(const s of LAND){const p=s.split(' ').map(q=>q.split(',').map(Number));mc.beginPath();
    p.forEach(([lo,la],i)=>{const x=(lo+180)/360*W,y=(90-la)/180*H;i?mc.lineTo(x,y):mc.moveTo(x,y)});mc.closePath();mc.fill()}
  const md=mc.getImageData(0,0,W,H).data,t=mk(),c=t.getContext('2d'),im=c.createImageData(W,H),d=im.data;
  for(let y=0;y<H;y++){const al=Math.abs(90-y/H*180);
    for(let x=0;x<W;x++){
      const xx=Math.min(W-1,Math.max(0,(x+(fbm(x/32,y/32)-.5)*14)|0)),yy=Math.min(H-1,Math.max(0,(y+(fbm(x/32+50,y/32)-.5)*14)|0));
      const n=fbm(x/48,y/48);let r,g,b;
      if(md[(yy*W+xx)*4]>127){
        const dry=Math.max(0,1-Math.abs(al-25)/14)*(.4+n),wet=Math.max(0,1-al/12);
        r=68+dry*135+n*30-wet*22;g=108+dry*68-n*10+wet*8;b=52+dry*32;
        if(al>63+n*8)r=g=b=222+n*30;
      }else{const s=n*20;r=8+s;g=46+s*1.5;b=100+s*2;if(al>77+n*5)r=g=b=205}
      const k=(y*W+x)*4;d[k]=r;d[k+1]=g;d[k+2]=b;d[k+3]=255}}
  c.putImageData(im,0,0);return t;
}
function makeClouds(){
  const W=1024,H=512,k=document.createElement('canvas');k.width=W;k.height=H;const c=k.getContext('2d'),im=c.createImageData(W,H),d=im.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=fbm(x/55,y/38+9)*.8+fbm(x/20,y/20)*.2,a=Math.max(0,(v-.52)*3.4);const i=(y*W+x)*4;d[i]=d[i+1]=d[i+2]=255;d[i+3]=Math.min(235,a*255)}
  c.putImageData(im,0,0);return k;
}

// ---- scene ----
const cv=document.getElementById('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:false});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setClearColor(0x04060d);
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,200);cam.position.z=3.6;
const sun=new THREE.DirectionalLight(0xfff4e0,1.5);sun.position.set(5,2,4);S.add(sun);
const amb=new THREE.AmbientLight(0x5577aa,.28);S.add(amb);
const pivot=new THREE.Group(),tilt=new THREE.Group();tilt.rotation.z=-23.4*Math.PI/180;pivot.add(tilt);S.add(pivot);
const tex=new THREE.CanvasTexture(makeEarth());tex.anisotropy=8;
const earth=new THREE.Mesh(new THREE.SphereGeometry(1,96,64),new THREE.MeshPhongMaterial({map:tex,shininess:14,specular:0x223344}));
earth.rotation.y=-Math.PI/2;tilt.add(earth);
const clouds=new THREE.Mesh(new THREE.SphereGeometry(1.012,64,48),new THREE.MeshPhongMaterial({map:new THREE.CanvasTexture(makeClouds()),transparent:true,depthWrite:false,opacity:.85}));
tilt.add(clouds);
const atm=new THREE.Mesh(new THREE.SphereGeometry(1.14,64,48),new THREE.ShaderMaterial({
  vertexShader:'varying vec3 n;void main(){n=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'varying vec3 n;void main(){float i=pow(max(0.,.68-dot(n,vec3(0,0,1.))),3.);gl_FragColor=vec4(.3,.62,1.,1.)*i*1.6;}',
  side:THREE.BackSide,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));
S.add(atm);
const sp=[];for(let i=0;i<1600;i++){const u=Math.random()*2-1,a=Math.random()*6.283,r=Math.sqrt(1-u*u);sp.push(60*r*Math.cos(a),60*u,60*r*Math.sin(a))}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
S.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xcfd8ee,size:.12,sizeAttenuation:true})));
const pin=new THREE.Mesh(new THREE.SphereGeometry(.014,12,12),new THREE.MeshBasicMaterial({color:0xffd166}));pin.visible=false;earth.add(pin);

function fit(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.position.z=Math.max(cam.position.z,0);cam.updateProjectionMatrix()}
addEventListener('resize',fit);fit();

// ---- interaction ----
let spin=!matchMedia('(prefers-reduced-motion: reduce)').matches,drag=null,moved=0,zoom=3.6;
pivot.rotation.x=.25;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};moved=0;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);
  pivot.rotation.y+=dx*.006;pivot.rotation.x=Math.max(-1.4,Math.min(1.4,pivot.rotation.x+dy*.006));drag={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointerup',e=>{if(drag&&moved<5)pick(e);drag=null});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(1.8,Math.min(7,zoom*(1+e.deltaY*.001)))},{passive:false});
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function pick(e){mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);
  const hit=ray.intersectObject(earth)[0],ro=document.getElementById('ro');
  if(!hit){pin.visible=false;return}
  const lon=hit.uv.x*360-180,lat=hit.uv.y*180-90;
  pin.position.copy(earth.worldToLocal(hit.point.clone()).multiplyScalar(1.004));pin.visible=true;
  ro.textContent=Math.abs(lat).toFixed(1)+'\u00b0'+(lat>=0?'N':'S')+', '+Math.abs(lon).toFixed(1)+'\u00b0'+(lon>=0?'E':'W')}
const tog=(id,fn)=>{const b=document.getElementById(id);b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);fn(on)}};
tog('bs',on=>spin=on);tog('bc',on=>clouds.visible=on);tog('bn',on=>amb.intensity=on?1.1:.28);
document.getElementById('bi').onclick=()=>zoom=Math.max(1.8,zoom*.8);
document.getElementById('bo').onclick=()=>zoom=Math.min(7,zoom*1.25);
if(!spin)document.getElementById('bs').setAttribute('aria-pressed','false');

(function loop(){requestAnimationFrame(loop);
  if(spin&&!drag){earth.rotation.y+=.0015;clouds.rotation.y+=.0019}
  cam.position.z+=(zoom-cam.position.z)*.12;R.render(S,cam)})();
</script></body></html>
